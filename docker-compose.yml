version: '3.8'

# ============================================================
# Volume persistente para o banco de dados PostgreSQL
# ============================================================
volumes:
  postgres_data:

services:

  # ----------------------------------------------------------
  # 1. BANCO DE DADOS POSTGRESQL
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: igreja_postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

  # ----------------------------------------------------------
  # 2. BACKEND (FastAPI Python)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: igreja_backend
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bi_learning}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      - postgres

  # ----------------------------------------------------------
  # 3. FRONTEND (React + Vite + Nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: igreja_frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

  # ----------------------------------------------------------
  # 4. CLOUDFLARE TUNNEL
  # ----------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: igreja_tunnel
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend


